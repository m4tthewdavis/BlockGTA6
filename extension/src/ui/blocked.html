<!doctype html>
<html lang="en">
<head>

  <main class="box">
    <img src="icons/icon-128.png" alt="">

    <div class="row">
      <button class="btn primary" id="back" type="button">Go back</button>
      <button class="btn" id="show" type="button">Show anyway</button>
    </div>
  </main>
  <script src="blocked.js"></script>
